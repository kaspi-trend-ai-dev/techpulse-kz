name: Deploy HARMEX MEDIA
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ['Frequent editorial publication', 'Backfill original article photos']
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Optimize HARMEX photo for web
        run: |
          python -m pip install --quiet Pillow
          python scripts/optimize_harmex.py
      - run: npm run check
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          GA_MEASUREMENT_ID: G-PQDW0511J6
      - name: Include standalone CLEARVISOR landing page
        run: |
          test -f landing-clearvisor/index.html
          mkdir -p dist/clearvisor
          cp landing-clearvisor/index.html dist/clearvisor/index.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
