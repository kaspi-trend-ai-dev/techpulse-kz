name: Backfill original article photos
on:
  workflow_dispatch:
  schedule:
    - cron: '37 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: techpulse-images
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract original source images for all existing articles
        run: node scripts/backfill-images.mjs
      - name: Commit updated articles and trigger site deployment
        run: |
          git config user.name 'techpulse-bot'
          git config user.email 'techpulse-bot@users.noreply.github.com'
          git add articles/
          if ! git diff --cached --quiet; then
            git commit -m 'Backfill original article images'
            git pull --rebase
            git push
          fi
      - name: Build and publish updated site
        run: |
          npm run build
          npm run check
      - name: Deploy to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
