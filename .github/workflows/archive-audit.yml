name: TechPulse archive content audit
on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit-historical.mjs'
      - 'articles/kak-vybrat-diagonal-televizora.json'
      - 'articles/pochemu-tormozit-smart-tv.json'
      - 'articles/televizor-dlya-spalni.json'
      - 'articles/opredelenie-optimalnogo-rasstoyaniya-do-ekrana-43-dyuyma-v-kazakhstane.json'
      - 'articles/gran-turismo-ps5-limited-dualsense-preorders.json'
      - 'articles/amazon-predstavil-pyat-novyh-kamer-dlya-umnogo-doma-blink.json'
      - 'articles/microsoft-project-helix-2028-price-and-plans.json'
      - 'articles/ogranicheniya-dvizheniya-mashin-na-letney-rezine-v-neskolkikh-regionakh-kazakhstana.json'
      - '.github/workflows/archive-audit.yml'
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: techpulse-archive-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Review historical content without deleting pages
        run: node scripts/audit-historical.mjs
      - name: Commit historical content quality report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/content-audit.json reports/CONTENT-QUALITY.md
          if ! git diff --cached --quiet; then
            git commit -m "Update TechPulse historical content quality report"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "Content quality report unchanged."
          fi
