name: Daily editorial publication
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
concurrency:
  group: techpulse-publish
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/publish-batch.mjs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
          OPENAI_MODEL: gpt-4.1-mini
      - name: Commit article
        if: always()
        run: |
          git config user.name 'techpulse-bot'
          git config user.email 'techpulse-bot@users.noreply.github.com'
          git add articles/
          git diff --cached --quiet || (git commit -m 'Publish editorial news batch' && git pull --rebase && git push)
