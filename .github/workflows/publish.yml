name: Daily editorial publication
on:
  schedule:
    - cron: '15 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run generate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
      - name: Commit article
        run: |
          git config user.name 'techpulse-bot'
          git config user.email 'techpulse-bot@users.noreply.github.com'
          git add articles/
          git diff --cached --quiet || (git commit -m 'Publish daily editorial article' && git push)
